name: CI

on:
  push:
    branches: [main]
    # 纯文档改动不跑构建/测试（另由 docs.yml 跑轻量 docs 检查）；文档与代码混合提交仍跑全量
    paths-ignore: &docs_only_paths
      - "docs/**"
      - "GLOSSARY.md"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths-ignore: *docs_only_paths
  # Windows 编译缓存预热（#133）：GitHub Actions 缓存按 ref 作用域，PR run 写入的缓存
  # 不能被其它 PR 复用；只有在默认分支上构建，PR 才能 restore 到。故 PR 侧只读缓存，
  # 由本定时任务 + workflow_dispatch + main push（#260）在 main 上写入（public 仓库
  # runner 不额外计费）；main push 的 warm job 与 Linux 验证同一 run 并行，不占 PR 等待。
  # 注意：合并 #133 后首个 PR 仍是冷缓存（需先有一次 main run 或手动触发一次 warm job）。
  #
  # **墙钟目标：按改动规模分档，不是一个固定分钟数**（#267 定案，推翻 #260 的「≤15min」）。
  # 原因是 PR 的语义就是改源码，改动必然让对应 TU 的缓存失效——固定目标必然对改动大的
  # PR 产生假告警，而假告警会让「CI 绿」失真。2026-11-04 六个含代码改动的 PR 实测
  # （计数来自 `git diff --name-only`，不是 PR 页面的 files 列表——后者含重命名项会虚高）：
  #
  #   PR     cpp  headers   Build       Windows job
  #   #268   0    0         4m06s       11m11s     small
  #   #264   1    0         5m32s       13m31s     small
  #   #269   12   11        16m59s      25m17s     medium
  #   #263   21   11        27m33s      34m51s     large
  #   #262   0*   0*        32m35s      41m01s     *改了 ci.yml 的 sccache 配置，缓存 key 全失配
  #
  # 结论：0/1 个 C++ 文件时 ~11–14min（缓存确实生效），21 个时 35min 属正常。
  # 分档口径与预算由 `scripts/ci_budget.py` 定义（small 18 / medium 30 / large 45 分钟），
  # 该脚本带 --selftest 与 unittest 并接入 preflight，用真实 PR 数据校验过四个样本。
  # 改动 CI 缓存配置或 runner 规格后重跑一次观测，再据此调整 —— 不要凭印象改数字。
  #
  # 命中率数据（#267）：sccache stats 与本次改动规模一起上传为 `windows-sccache-stats`
  # artifact（保留 30 天）。取用与归因：
  #   gh run download <run-id> -n windows-sccache-stats -D .cache/ci-stats
  #   python3 scripts/ci_budget.py --from-git origin/main...HEAD --actual <min> \
  #       --stats-file .cache/ci-stats/sccache-stats.txt
  # 脚本会按命中率给出归因（低命中率 -> 查缓存；命中率健康 -> 是规模或 runner 抖动）。
  #
  # 曾考虑但**否决**的改进：把 PR 侧 `SCCACHE_GHA_RW_MODE` 从 READ_ONLY 改成 READ_WRITE。
  # 不会改善后续 PR 命中率——GitHub Actions 缓存按 ref 作用域，PR 写在 `refs/pull/N/merge`
  # 下，其它 PR restore 不到（这正是 warm job 必须放在 main 上的原因）。
  #
  # 快路径（#289 AC3）：PR 的改动面由 `scripts/ci_scope.py` 分类为 fast / full，`scope` job
  # （仅 pull_request）输出 `mode`；fast 时跳过构建/测试/前端四步，只保留 preflight（它才是
  # scripts、docs 改动的验证面）。**denylist 只在 `scripts/ci_scope.py` 定义一处**，本文件不
  # 重复列举——两处定义必然漂移，改规则请改脚本并跑 `--selftest`。
  #   - 逃生口：PR 带 `ci-full` 标签强制全量（标签判断独立于 mode，fast 也覆盖）。
  #   - main push 永远全量：`scope` job 不跑，`needs.scope.outputs.mode` 为空，各步条件里的
  #     `github.event_name != 'pull_request'` 分支保证照常执行。
  schedule:
    - cron: "17 16 * * *"  # UTC 16:17 = Asia/Shanghai 00:17
  # 手动触发：
  #   - run_perf=false（默认）：只跑缓存预热 job，与夜间定时任务一致；
  #   - run_perf=true：额外让 linux job 跑 perf 档性能基准（#164，report-only，不进默认门禁）。
  workflow_dispatch:
    inputs:
      run_perf:
        description: "跑性能基准（report-only，仅 Linux）"
        type: boolean
        default: false

# 同一分支的新 push 取消上一次仍在跑的 PR run，避免 #93 那种「3 个 run 排队后被取代」的浪费。
# main 的 push run 不取消（保持每个 merge commit 的验证结果）。
# 分组按职责拆分（#133）：schedule / workflow_dispatch 只跑缓存预热 job，与 push/PR 的验证
# run 不同组——否则预热 run 会把同时进行的 main 验证 run 挤成 pending 再 cancelled
# （实测 run 40256065312 被 dispatch 挤掉）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'verify' || 'warm' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 改动面分类（#289 AC3）：廉价 job，只跑确定性分类器，输出 mode=fast|full。
  # 用三点 diff（base...head = merge-base 到 head）：两点 diff 会把 main 前进后落在
  # base 与 merge-base 之间的无关提交算进来，分类必然虚高。
  # 只在 pull_request 上跑；push/schedule/dispatch 下本 job 被 skip（未产出 outputs），
  # 下游 windows/linux 的条件里用 `github.event_name != 'pull_request'` 显式覆盖该情形。
  scope:
    name: PR scope (fast/full)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 分类要用 merge-base（base...head），浅克隆取不到共同祖先。
          fetch-depth: 0

      # 分类器自身失败（退出码 2）时回退 full：full 就是今天的行为，安全方向；
      # 反之「失败即 fast」会静默跳过验证面。不把 step 弄红，避免 needs 失败导致
      # windows/linux 整个被 skip —— 那等于连 preflight 都不跑。
      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if out="$(python3 scripts/ci_scope.py --range "${BASE_SHA}...${HEAD_SHA}")"; then
            echo "ci-scope: ${out}"
            echo "${out}" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "::warning::scripts/ci_scope.py failed (rc=${rc}); falling back to mode=full"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (MSVC Release)
    # Windows 只在 PR 上跑：PR 校验的是 merge-ref，已覆盖合并结果；main push 只跑 Linux，
    # 省下每票 11–41 分钟的重复 Windows 验证（实测区间见文件头的分档表；本波 11 票
    # Windows 全绿，MSVC 问题在 PR 也可见）。
    # 快路径（#289 AC3）：PR 上还要 scope 判定为 full，或 PR 带 `ci-full` 标签（独立于
    # mode 的逃生口 —— 「fast + 标签」因此会强制全量）。标签判断写在 needs 之外，正是
    # 为了不被 skip 时的空 outputs 影响：非 PR 事件本 job 本就不跑。
    needs: scope
    if: >-
      github.event_name == 'pull_request' &&
      (needs.scope.outputs.mode == 'full' ||
       contains(github.event.pull_request.labels.*.name, 'ci-full'))
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 冒烟测试冲突(dev 栈/孤儿进程)时直接失败, 防止被静默跳过造成假绿
      DZ_SMOKE_STRICT: "1"
      # CI 编译缓存（#133）：sccache 直接用 Actions cache；缓存服务异常时降级为直编，不让构建红。
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # PR run 只读缓存：写缓存由 main 上的夜间热身 job 负责（GHA 缓存按 ref 作用域，
      # 在 PR ref 下写的缓存无法被其它 PR 复用）。未命中就当普通编译，不影响正确性。
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      # setup.ps1 只在 CI 显式打开 sccache launcher：本地增量构建保持不接，避免与
      # CMakeLists 硬编码的 MSVC /showIncludes 前缀（依赖追踪）互相影响。
      DZ_SCCACHE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本钉死：sccache 版本进缓存 key，warm/PR 不一致会导致全部 miss。
      - name: Setup sccache (MSVC compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/win-msvc-static') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      # 前端 npm ci 是冷安装：缓存 npm 下载目录，避免每次 run 重复拉包。只缓存 ~/.npm，
      # 不缓存 node_modules（lock 变更时 node_modules 会过期，且本构建对 dist 有完整性要求）。
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup (conan install + cmake configure)
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Build (C++ + frontend dist)
        shell: pwsh
        run: .\scripts\build.ps1

      # 命中率证据（#260，与 Linux 的 ccache stats 对齐）：失败不阻断构建。
      #
      # #267：原本只 `sccache --show-stats` 打到日志里，结论是「拿不到」——该步骤
      # continue-on-error，输出混在数十 MB 的 job 日志中（Windows 日志 99% 是
      # /showIncludes 噪声），既无法机器解析也无法跨 run 对比。没有命中率数据，
      # 就只能凭墙钟猜缓存是否生效（#260 把主因误判为「配额挤兑」正是这么来的）。
      # 因此改为**落一份机器可读的 artifact**：job 结束后 `gh run download` 即可取，
      # 与本次改动的规模计数并列，供 ci_budget.py 做命中率-墙钟关联。
      - name: sccache stats
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $raw = sccache --show-stats 2>&1 | Out-String
          Write-Output $raw
          # 逐行 `key: value` 落盘（sccache --show-stats 的文本格式稳定），
          # 同时记录改动规模，让 artifact 自带解释墙钟所需的全部输入。
          New-Item -ItemType Directory -Force -Path .cache/ci-stats | Out-Null
          $raw | Set-Content -Path .cache/ci-stats/sccache-stats.txt -Encoding utf8
          if (Test-Path env:GITHUB_SHA) {
            "commit=$env:GITHUB_SHA" | Add-Content .cache/ci-stats/sccache-stats.txt
          }

      - name: Record Windows change scale (#267)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          # 计数口径与 scripts/ci_budget.py 一致：git diff --name-only（不是 PR 页面
          # files 列表——后者含重命名项，实测虚高约 50%，用它校准会判错档位）。
          $base = "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrEmpty($base)) { $base = "origin/main" }
          $files = git diff --name-only "$base...HEAD" 2>$null
          $cpp = ($files | Where-Object { $_ -match '\.(cpp|cc|cxx|c)$' }).Count
          $hdr = ($files | Where-Object { $_ -match '\.(h|hpp|hh|hxx)$' }).Count
          New-Item -ItemType Directory -Force -Path .cache/ci-stats | Out-Null
          "cpp_files=$cpp" | Add-Content .cache/ci-stats/change-scale.txt
          "header_files=$hdr" | Add-Content .cache/ci-stats/change-scale.txt

      - name: Upload sccache stats + change scale (#267)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-sccache-stats
          path: .cache/ci-stats/
          if-no-files-found: ignore
          retention-days: 30

      - name: C++ Tests (incl. integration smoke)
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Frontend Type Check
        shell: pwsh
        working-directory: apps/webui/frontend
        run: npm run type-check

      - name: Frontend Lint
        shell: pwsh
        working-directory: apps/webui/frontend
        run: npm run lint && npm run lint:css

      - name: Frontend Contract Types Freshness
        shell: pwsh
        working-directory: apps/webui/frontend
        run: |
          npm run gen:types
          git diff --exit-code src/types/generated.ts

      - name: Frontend Tests
        shell: pwsh
        working-directory: apps/webui/frontend
        run: npm test

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: last-test-log
          path: build/windows/x86_64/Release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux:
    name: Linux (GCC Release)
    # schedule / dispatch 只为预热 Windows 缓存（见 windows-cache-warm）；Linux 已由每次
    # main push 与每个 PR 覆盖，不在这两种触发下重复跑。例外：手动触发并勾选 run_perf=true
    # 时跑一次 perf 档性能基准（#164，report-only）。
    #
    # `needs: scope` + `!cancelled()`（#289 AC3）：scope job 只在 pull_request 上跑，
    # push / dispatch 下它被 skip；GitHub 会把 needs 的 skip 传播到本 job，除非 if 里含
    # 状态检查函数。`!cancelled()` 即该用途（比 always() 更精确：工作流被取消时不硬跑）。
    # 这保证 main push 与 run_perf dispatch 的现有语义完全不变。
    needs: scope
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_perf))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # 冒烟测试冲突时直接失败, 防止被静默跳过造成假绿 (Linux 上冲突检测暂为空实现, 恒跑)
      DZ_SMOKE_STRICT: "1"
      # 必须与 ccache-action 的缓存目录一致（action 读 CCACHE_DIR，未设时用
      # ${GITHUB_WORKSPACE}/.ccache）；否则 restore/save 的目录 ≠ 编译实际写入目录，
      # 表现为"ccache: enabled 但永不命中"。
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CI 编译缓存（#133）：只缓存编译器输出，绝不缓存 build/ 目录（陈旧 obj/依赖追踪是
      # C++ CI 的公认坑）。setup.sh 会自动检测 ccache 并接 CMAKE_CXX_COMPILER_LAUNCHER，
      # 这里负责把 CCACHE_DIR 持久化；是否生效看 setup 日志 "ccache: enabled" 与下方统计。
      # append-timestamp: false（#260）：默认 true 时 save key 追加 ISO 时间戳，每次 main
      # push 新增一份约 1GB 缓存（2026-11-04 实测 10 份共 8.8GB，全仓 actions cache 合计
      # 10.4GB 超 10GB 配额，Windows sccache 有被 LRU 挤出风险）；改为 false 后 save key
      # 固定（不含时间戳，v1.2 实现里为 `ccache-`+key+`-`），每次 push 不再新增条目。
      # 代价：GHA cache key 不可变，固定 key 首次保存后内容即冻结（重复 save 仅 warning、
      # 不失败），需刷新时手动在 key 里 bump 版本（如 ccache-linux-v2-...）。
      # 注：action 始终在 key/restore-keys 前拼 `ccache-`；v1.2 的 restore 侧还把
      # append-timestamp 当字符串读（`false` 也是非空串），实际仍会追加尾 `-`，只有 save
      # 侧按布尔解析、不加时间戳。故 restore-keys 仍不能带尾 `-`，否则成
      # `ccache-ccache-linux--` 永不命中。
      # PR 不写缓存（写了也只对本次 PR 可见，白占配额），缓存由 main push 写入。
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          key: ccache-linux-${{ github.ref }}
          restore-keys: |
            ccache-linux
          max-size: 1000M
          append-timestamp: false
          save: ${{ github.event_name != 'pull_request' }}

      - name: Install clang-format 21 (apt.llvm.org, official LLVM)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y clang-format-21
          clang-format-21 --version

      - name: Repo preflight (C 段，清单见脚本头)
        # 前后端两类快路径下都**保留**：它是 scripts / docs 改动的唯一验证面
        # （ci_scope / unittest / 文档链接 / 格式检查都在这里跑，#289 AC3）。
        run: ./scripts/preflight.sh --c-only

      - name: Commit Message Check (prefix)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          # 单一真相源：scripts/check_commit_subject.py（#265）。此前内联正则只查前缀，
          # 漏掉了 `fix: #246 x` 这种合规但会触发 GitHub auto-close、进而静默丢弃关闭
          # 评论的形态。规则与 selftest 都在脚本里，pre-commit hook 共用同一份。
          python3 scripts/check_commit_subject.py --selftest
          python3 scripts/check_commit_subject.py --range "${{ github.event.before }}..${{ github.sha }}"

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/linux-gcc') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      # 前端 npm ci 是冷安装：缓存 npm 下载目录，避免每次 run 重复拉包。只缓存 ~/.npm，
      # 不缓存 node_modules（lock 变更时 node_modules 会过期）。
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup (conan install + cmake configure)
        run: ./scripts/setup.sh release

      # 快路径（#289 AC3）：fast 模式下跳过构建与测试，但**只有 PR 才可能 fast**。
      # `needs.scope.outputs.mode != 'fast'` 在非 PR 事件下取值是空串（scope job 未跑），
      # 此时 `github.event_name != 'pull_request'` 分支为真 → 照常执行（main push 全量）。
      # `ci-full` 标签是独立逃生口：fast + 标签也强制跑。
      - name: Build (C++ + frontend dist)
        if: needs.scope.outputs.mode != 'fast' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
        run: ./scripts/build.sh --config release

      # 命中率证据（#289 AC4）：ubuntu-24.04 的 ccache 4.9 不支持 action 的 JSON job
      # summary；原先只 `ccache --show-stats` 打日志，混在 job 日志里无法跨 run 归因
      # （#272 一个测试 cpp 跑 11m55s、#284 零 C++ 跑 14m51s 都是这样发现的）。
      # 这里落一份与 Windows `windows-sccache-stats` 对称的 artifact：统计 + 本次改动
      # 规模（cpp/header 计数，口径与 scripts/ci_budget.py 一致）。
      # **只取证，不设墙钟预算门禁**：先拿数据再决定改不改缓存（#260 误判的教训）。
      - name: ccache stats
        if: always()
        continue-on-error: true
        run: |
          # 统计失败（ccache action 挂了 / 没装）不能让 job 红，也不能吞掉后面的规模行。
          ccache --show-stats 2>&1 | tee /tmp/ccache-stats.txt || true
          mkdir -p .cache/ci-stats
          cp /tmp/ccache-stats.txt .cache/ci-stats/ccache-stats.txt
          # 改动规模：三点 diff（merge-base..HEAD），与 Windows 侧 Record Windows change
          # scale (#267) 同口径；base 取 PR base sha，非 PR（push/dispatch）回退 origin/main。
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="origin/main"; fi
          files="$(git diff --name-only "${base}...HEAD" 2>/dev/null || true)"
          cpp=$(printf '%s\n' "$files" | grep -cE '\.(cpp|cc|cxx|c)$' || true)
          hdr=$(printf '%s\n' "$files" | grep -cE '\.(h|hpp|hh|hxx)$' || true)
          {
            echo "commit=${GITHUB_SHA}"
            echo "cpp_files=${cpp}"
            echo "header_files=${hdr}"
          } >> .cache/ci-stats/ccache-stats.txt

      - name: Upload ccache stats + change scale (#289 AC4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ccache-stats
          path: .cache/ci-stats/
          if-no-files-found: ignore
          retention-days: 30

      - name: C++ Tests (incl. integration smoke)
        if: needs.scope.outputs.mode != 'fast' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
        run: ./scripts/test.sh --config release

      # 性能基准（#164）：report-only，默认门禁不跑。手动 workflow_dispatch 勾选
      # run_perf=true 时执行：先经 test.sh（清空 test_home + 测试锁）跑 perf 档，
      # 再用 ctest -V 回放一次以把数值打进日志（ctest 默认只在失败时回显输出）。
      - name: Performance benchmarks (report-only, manual trigger)
        if: github.event_name == 'workflow_dispatch' && inputs.run_perf
        run: |
          ./scripts/test.sh --config release --label perf
          ctest --preset linux-release-perf -V --no-tests=error

      # 快路径（#289 AC3）：四个前端步骤与 Build/C++ Tests 同条件。理由：前端目录
      # `apps/webui/frontend/**` 在 `scripts/ci_scope.py` 的 denylist 内，任何前端改动
      # 都必然把 mode 判成 full —— 也就是说 **fast 模式下不可能存在前端失败面**，
      # 这些步骤只会空转（每步 npm 冷启动 + type-check 约十几秒到一分钟）。
      - name: Frontend Type Check
        if: needs.scope.outputs.mode != 'fast' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
        working-directory: apps/webui/frontend
        run: npm run type-check

      - name: Frontend Lint
        if: needs.scope.outputs.mode != 'fast' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
        working-directory: apps/webui/frontend
        run: npm run lint && npm run lint:css

      - name: Frontend Contract Types Freshness
        if: needs.scope.outputs.mode != 'fast' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
        working-directory: apps/webui/frontend
        run: |
          npm run gen:types
          git diff --exit-code src/types/generated.ts

      - name: Frontend Tests
        if: needs.scope.outputs.mode != 'fast' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
        working-directory: apps/webui/frontend
        run: npm test

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: last-test-log-linux
          path: build/linux/x86_64/Release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ============================================================
  # Windows 编译缓存预热（#133）
  # sccache 的 GitHub Actions 缓存按 ref 作用域：PR run 写入的缓存其它 PR 读不到，
  # 只有默认分支（main）写的缓存能被任意 PR restore。因此本 job 在 main 上只做
  # “configure + build” 把编译结果写进 sccache，不做测试（测试仍由 PR 的 windows job 负责）；
  # main push（#260，每次含代码改动的 merge 后异步预热，与 Linux 验证同一 run 并行；纯文档
  # 改动被 on.push.paths-ignore 跳过，不触发本 job）+ 定时 + 手动触发，
  # 不占用任何 PR 的等待时间。
  # ============================================================
  windows-cache-warm:
    name: Windows cache warm (main)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      DZ_SCCACHE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup sccache (MSVC compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/win-msvc-static') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup (conan install + cmake configure)
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Build (C++ + frontend dist)
        shell: pwsh
        run: .\scripts\build.ps1
