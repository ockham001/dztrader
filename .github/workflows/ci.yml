name: CI

on:
  push:
    branches: [main]
    # 纯文档改动不跑构建/测试（另由 docs.yml 跑轻量 docs 检查）；文档与代码混合提交仍跑全量
    paths-ignore: &docs_only_paths
      - "docs/**"
      - "GLOSSARY.md"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths-ignore: *docs_only_paths
  # 夜间预热 Windows 编译缓存（#133）：GitHub Actions 缓存按 ref 作用域，PR run 写入的
  # 缓存不能被其它 PR 复用；只有在默认分支上构建，PR 才能 restore 到。故 PR 侧只读缓存，
  # 由本定时任务 + workflow_dispatch 在 main 上写入（public 仓库 runner 不额外计费）。
  schedule:
    - cron: "17 16 * * *"  # UTC 16:17 = Asia/Shanghai 00:17
  workflow_dispatch:

# 同一分支的新 push 取消上一次仍在跑的 PR run，避免 #93 那种「3 个 run 排队后被取代」的浪费。
# main 的 push run 不取消（保持每个 merge commit 的验证结果）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows (MSVC Release)
    # Windows 只在 PR 上跑：PR 校验的是 merge-ref，已覆盖合并结果；main push 只跑 Linux，
    # 省下每票 ~35–40 分钟的重复 Windows 验证（本波 11 票 Windows 全绿，MSVC 问题在 PR 也可见）。
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 冒烟测试冲突(dev 栈/孤儿进程)时直接失败, 防止被静默跳过造成假绿
      DZ_SMOKE_STRICT: "1"
      # CI 编译缓存（#133）：sccache 直接用 Actions cache；缓存服务异常时降级为直编，不让构建红。
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # PR run 只读缓存：写缓存由 main 上的夜间热身 job 负责（GHA 缓存按 ref 作用域，
      # 在 PR ref 下写的缓存无法被其它 PR 复用）。未命中就当普通编译，不影响正确性。
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      # setup.ps1 只在 CI 显式打开 sccache launcher：本地增量构建保持不接，避免与
      # CMakeLists 硬编码的 MSVC /showIncludes 前缀（依赖追踪）互相影响。
      DZ_SCCACHE: "1"
      # ctest 并行（套件内的 RUN_SERIAL 仍串行）
      CTEST_PARALLEL_LEVEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup sccache (MSVC compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      # sccache 的 GHA 后端需要 Actions 运行时 token（见 sccache docs/GHA.md）。
      - name: Configure sccache GHA cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/win-msvc-static') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      # 前端 npm ci 是冷安装：缓存 npm 下载目录，避免每次 run 重复拉包。只缓存 ~/.npm，
      # 不缓存 node_modules（lock 变更时 node_modules 会过期，且本构建对 dist 有完整性要求）。
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup (conan install + cmake configure)
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Build (C++ + frontend dist)
        shell: pwsh
        run: .\scripts\build.ps1

      - name: C++ Tests (incl. integration smoke)
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Frontend Type Check
        shell: pwsh
        working-directory: apps/webui/frontend
        run: npm run type-check

      - name: Frontend Lint
        shell: pwsh
        working-directory: apps/webui/frontend
        run: npm run lint && npm run lint:css

      - name: Frontend Contract Types Freshness
        shell: pwsh
        working-directory: apps/webui/frontend
        run: |
          npm run gen:types
          git diff --exit-code src/types/generated.ts

      - name: Frontend Tests
        shell: pwsh
        working-directory: apps/webui/frontend
        run: npm test

      # 缓存命中率是"接线是否生效"的验收证据（见 #133）；stats 失败不阻断构建。
      - name: Sccache stats
        if: always()
        continue-on-error: true
        shell: pwsh
        run: sccache --show-stats

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: last-test-log
          path: build/windows/x86_64/Release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux:
    name: Linux (GCC Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # 冒烟测试冲突时直接失败, 防止被静默跳过造成假绿 (Linux 上冲突检测暂为空实现, 恒跑)
      DZ_SMOKE_STRICT: "1"
      # ctest 并行（套件内的 RUN_SERIAL 仍串行）
      CTEST_PARALLEL_LEVEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ccache
        run: sudo apt-get install -y ccache

      # CI 编译缓存（#133）：只缓存编译器输出，绝不缓存 build/ 目录（陈旧 obj/依赖追踪是
      # C++ CI 的公认坑）。setup.sh 会自动检测 ccache 并接 CMAKE_CXX_COMPILER_LAUNCHER，
      # 这里只需把缓存目录持久化；是否生效以 setup 日志的 "ccache: enabled" 行为准。
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-${{ github.ref }}
          restore-keys: |
            ccache-linux-
          max-size: 1500M

      - name: Install clang-format 21 (apt.llvm.org, official LLVM)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y clang-format-21
          clang-format-21 --version

      - name: Repo preflight (log format / C++ format / docs links / test portability / MSVC hazards)
        run: ./scripts/preflight.sh --c-only

      - name: Commit Message Check (prefix)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          fail=0
          while IFS=$'\t' read -r sha subject; do
            case "$subject" in Merge*|Revert*|fixup*|squash*) continue;; esac
            if ! printf '%s' "$subject" | grep -qE '^(fix|feat|refactor|docs|test|chore|perf|style|build|ci)(\([^)]+\))?!?: .+'; then
              echo "bad commit subject: $sha $subject"
              fail=1
            fi
          done < <(git log --no-merges --format='%H%x09%s' "${{ github.event.before }}..${{ github.sha }}")
          exit $fail

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/linux-gcc') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      # 前端 npm ci 是冷安装：缓存 npm 下载目录，避免每次 run 重复拉包。只缓存 ~/.npm，
      # 不缓存 node_modules（lock 变更时 node_modules 会过期）。
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup (conan install + cmake configure)
        run: ./scripts/setup.sh release

      - name: Build (C++ + frontend dist)
        run: ./scripts/build.sh --config release

      - name: C++ Tests (incl. integration smoke)
        run: ./scripts/test.sh --config release

      - name: Frontend Type Check
        working-directory: apps/webui/frontend
        run: npm run type-check

      - name: Frontend Lint
        working-directory: apps/webui/frontend
        run: npm run lint && npm run lint:css

      - name: Frontend Contract Types Freshness
        working-directory: apps/webui/frontend
        run: |
          npm run gen:types
          git diff --exit-code src/types/generated.ts

      - name: Frontend Tests
        working-directory: apps/webui/frontend
        run: npm test

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: last-test-log-linux
          path: build/linux/x86_64/Release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ============================================================
  # Windows 编译缓存预热（#133）
  # sccache 的 GitHub Actions 缓存按 ref 作用域：PR run 写入的缓存其它 PR 读不到，
  # 只有默认分支（main）写的缓存能被任意 PR restore。因此本 job 在 main 上只做
  # “configure + build” 把编译结果写进 sccache，不做测试（测试仍由 PR 的 windows job 负责）；
  # 定时 + 手动触发，不占用任何 PR 的等待时间。
  # ============================================================
  windows-cache-warm:
    name: Windows cache warm (main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      DZ_SCCACHE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup sccache (MSVC compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache GHA cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/win-msvc-static') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup (conan install + cmake configure)
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Build (C++ + frontend dist)
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Sccache stats
        if: always()
        continue-on-error: true
        shell: pwsh
        run: sccache --show-stats
