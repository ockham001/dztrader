name: Release

# 打 tag 时产出可部署产物（#168 C7）。
#
# 为什么单独一个 workflow 而不是并进 ci.yml：
#   - 触发条件不同（tag vs push/PR），并进去会让 concurrency group 与 paths-ignore 互相干扰
#   - 产物与验证是两件事：CI 绿不绿看不出来「这次发的是哪一版」
#
# 产物形态（对应 ADR 0037）：
#   - Linux:  install/linux/x86_64/Release/ 打成 tar.gz（已 strip，约 66MB），
#             调试符号 Release-debug-symbols/ 单独作为 artifact（不进发布包）
#   - Windows: install/windows/x86_64/Release/ 打成 zip，*.pdb 单独作为 artifact
#   - 两者都附 SHA256SUMS
#
# 打 tag 前的门禁：tag 必须指向 main 上已通过 CI 的 commit。本 workflow 不重复跑测试
# （CI 已在合并时验证过），只做「构建 → install → 打包 → 发布」。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（workflow_dispatch 用，例如 v0.1.0）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux Release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          key: release-linux-${{ inputs.tag || github.ref_name }}
          restore-keys: |
            ccache-linux
          max-size: 1000M
          save: true

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/linux-gcc') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 从 tag 解析版本与 pre-release，并校验与 project(VERSION) 一致（#170 / ADR 0038）。
      # 必须在 setup 之前：DZ_PRERELEASE 要在 configure 时注入，否则产物丢掉 rc 标识。
      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "error: tag is not semver-with-v | tag=$tag"
            exit 1
          fi
          base=$(printf '%s' "$tag" | sed -E 's/^v//; s/-.*$//')
          pre=$(printf '%s' "$tag" | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+-(.+)$/\1/p')
          proj=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt | head -1)
          if [ -z "$proj" ]; then
            echo "error: cannot read project(VERSION) from CMakeLists.txt"
            exit 1
          fi
          if [ "$base" != "$proj" ]; then
            echo "error: tag/version mismatch | tag=$tag tag_version=$base project_version=$proj"
            echo "       bump project(VERSION) in CMakeLists.txt before tagging"
            exit 1
          fi
          echo "tag/version OK | tag=$tag base=$base prerelease=${pre:-<none>}"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Setup / Build / Install artifacts
        env:
          DZ_PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          # DZ_PRERELEASE 经 CMakePresets 的 cacheVariables 注入（见 setup.sh 的 -D 传参）
          ./scripts/setup.sh
          ./scripts/build.sh
          ./scripts/install-artifacts.sh

      - name: Verify built version string
        run: |
          set -euo pipefail
          # 产物必须自称 tag 的完整版本（含 pre-release）
          want="${{ inputs.tag || github.ref_name }}"
          want="${want#v}"
          cat > /tmp/vercheck.c <<'EOF'
          #include <stdio.h>
          extern const char* dz_version_string(void);
          int main(void) { printf("%s", dz_version_string()); return 0; }
          EOF
          gcc /tmp/vercheck.c -o /tmp/vercheck \
            -Linstall/linux/x86_64/Release -ldztrader \
            -Wl,-rpath,"$PWD/install/linux/x86_64/Release"
          got=$(/tmp/vercheck)
          if [ "$got" != "$want" ]; then
            echo "error: built version mismatch | want=$want got=$got"
            exit 1
          fi
          echo "built version OK | version=$got"

      - name: Verify install tree
        run: |
          set -euo pipefail
          root=install/linux/x86_64/Release
          test -x "$root/dztraderd" || { echo "missing dztraderd"; exit 1; }
          test -d "$root/web" || { echo "missing web/"; exit 1; }
          # 测试产物不应出现在部署包里（#168 C5）
          if find "$root" -path "*/tests/*" | grep -q .; then
            echo "test binaries leaked into install tree"
            find "$root" -path "*/tests/*" | head
            exit 1
          fi
          echo "install tree OK: $(du -sh "$root" | cut -f1)"

      - name: Package
        run: |
          set -euo pipefail
          ver="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist
          tar -C install/linux/x86_64 -czf "dist/dztrader-${ver}-linux-x86_64.tar.gz" Release
          tar -C install/linux/x86_64 -czf "dist/dztrader-${ver}-linux-x86_64-debug-symbols.tar.gz" \
            Release-debug-symbols
          (cd dist && sha256sum *.tar.gz > SHA256SUMS-linux.txt)
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          retention-days: 90

  build-windows:
    name: Windows Release artifacts
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      DZ_SCCACHE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup sccache (MSVC compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan==2.32.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py', 'profiles/win-msvc-static') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/webui/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 与 Linux job 同一守卫（#170 / ADR 0038）：tag 必须与 project(VERSION) 一致，
      # 且必须在 build 之前解析（DZ_PRERELEASE 要在 configure 时注入）。
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:-(.+))?$') {
            Write-Error "tag is not semver-with-v | tag=$tag"; exit 1
          }
          $base = $Matches[1]
          $pre = if ($Matches.Count -gt 2 -and $Matches[2]) { $Matches[2] } else { "" }
          $line = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+(\d+\.\d+\.\d+)\s*$' |
            Select-Object -First 1
          if (-not $line) { Write-Error "cannot read project(VERSION) from CMakeLists.txt"; exit 1 }
          $proj = $line.Matches[0].Groups[1].Value
          if ($base -ne $proj) {
            Write-Error "tag/version mismatch | tag=$tag tag_version=$base project_version=$proj"
            Write-Error "bump project(VERSION) in CMakeLists.txt before tagging"
            exit 1
          }
          Write-Host "tag/version OK | tag=$tag base=$base prerelease=$pre"
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup / Build
        shell: pwsh
        env:
          DZ_PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          .\scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install
        shell: pwsh
        run: |
          cmake --install build/windows/x86_64/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Windows 侧符号收敛守卫（ADR 0038 决策 7）：MSVC 的 __declspec(dllexport)
      # 天然只导出标记过的函数，但「忘了标 DZ_API」会让新 API 静默不可见。
      # Linux 侧由 version-script 白名单保证，Windows 侧靠这条断言。
      - name: Verify SDK exports
        shell: pwsh
        run: |
          $dll = "install/windows/x86_64/Release/dztrader.dll"
          if (-not (Test-Path $dll)) { Write-Error "missing $dll"; exit 1 }
          $dumpbin = (Get-Command dumpbin -ErrorAction SilentlyContinue)
          if (-not $dumpbin) {
            # 通过 Developer Command Prompt 环境查找
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            $dumpbinPath = Get-ChildItem -Path $vs -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $dumpbinPath) { Write-Error "dumpbin not found"; exit 1 }
            $dumpbin = $dumpbinPath.FullName
          } else { $dumpbin = $dumpbin.Source }
          $out = & $dumpbin /nologo /exports $dll
          $exports = @($out | Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "exported symbols: $($exports.Count)"
          $nonDz = @($exports | Where-Object { $_ -notmatch '^\??dz_' })
          if ($nonDz.Count -gt 0) {
            Write-Error "SDK exports non-dz_ symbols (symbol leak):"
            $nonDz | Select-Object -First 10 | ForEach-Object { Write-Error "  $_" }
            exit 1
          }
          Write-Host "SDK exports OK | count=$($exports.Count) all dz_*"

      - name: Verify install tree
        shell: pwsh
        run: |
          $root = "install/windows/x86_64/Release"
          if (-not (Test-Path "$root/dztraderd.exe")) { Write-Error "missing dztraderd.exe"; exit 1 }
          if (-not (Test-Path "$root/web")) { Write-Error "missing web/"; exit 1 }
          # 测试产物不应出现在部署包里（#168 C5）
          $leaked = Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.FullName -match '\\tests\\' }
          if ($leaked) {
            Write-Error "test binaries leaked into install tree"
            $leaked | Select-Object -First 5 | ForEach-Object { Write-Error $_.FullName }
            exit 1
          }
          Write-Host "install tree OK"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          Write-Host "zipping install tree ..."
          Compress-Archive -Path "install/windows/x86_64/Release/*" `
            -DestinationPath "dist/dztrader-$ver-windows-x86_64.zip" -Force

          # PDB 单独归档（ADR 0037 / Q25=B）：不进发布包，体积大且暴露符号。
          #
          # 只归档**部署产物**对应的 PDB（#173）：build 树下有 177 个 PDB，其中 168 个
          # 来自测试可执行文件 —— 测试既不 install 也不部署，它们的 PDB 属于构建中间产物。
          # 首次实测把全部 177 个打包，产出 1.8GB 的符号包（产品实际只有 7 个二进制）。
          # 现在改为「以 install 树里的二进制为准，反查同名 PDB」，符号包应回到百 MB 量级。
          #
          # 用 7z 而不是 Compress-Archive：实测 177 个 PDB 走 Compress-Archive 耗时
          # 8 分 17 秒（逐条目调用 ZipArchive，不支持并行）。缺失 7z 时回退。
          $installedStems = @{}
          Get-ChildItem -Path "install/windows/x86_64/Release" -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            ForEach-Object { $installedStems[$_.BaseName] = $true }
          Write-Host "installed binaries: $($installedStems.Count)"

          $allPdbs = @(Get-ChildItem -Path "build/windows/x86_64/Release" -Filter *.pdb -Recurse -File)
          $pdbs = @($allPdbs | Where-Object { $installedStems.ContainsKey($_.BaseName) })
          Write-Host "pdb total=$($allPdbs.Count) matching-deployable=$($pdbs.Count)"

          if ($pdbs.Count -gt 0) {
            $symbolDir = "pdb-staging"   # 不放 dist/ 下：避免 hash 步骤把目录当文件
            New-Item -ItemType Directory -Path $symbolDir -Force | Out-Null
            $pdbs | ForEach-Object { Copy-Item $_.FullName -Destination $symbolDir -Force }
            $symZip = "dist/dztrader-$ver-windows-x86_64-debug-symbols.zip"
            $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
            if ($sevenZip) {
              & $sevenZip.Source a -tzip -mx=1 $symZip "$symbolDir/*" | Out-Null
              if ($LASTEXITCODE -ne 0) { Write-Error "7z failed | exit=$LASTEXITCODE"; exit 1 }
            } else {
              Write-Host "7z not found; falling back to Compress-Archive (slow)"
              Compress-Archive -Path "$symbolDir/*" -DestinationPath $symZip -Force
            }
            Write-Host "archived $($pdbs.Count) pdb files"
          } else {
            Write-Host "warning: no PDB files matching deployed binaries"
          }

          # 只对**文件**做 hash（此前漏了 -File，把 dist/symbols 目录也传给了
          # Get-FileHash，导致 "Access to the path ... is denied" 失败）。
          Get-ChildItem -Path dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content "dist/SHA256SUMS-windows.txt"
          Get-ChildItem -Path dist -File | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # 幂等：tag 已存在 release 时追加/覆盖资产，而不是失败
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
